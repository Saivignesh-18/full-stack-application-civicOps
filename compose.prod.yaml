# CivicOps Production Compose (single EC2 host)
# Usage:
#   1. Create a .env file next to this (see .env.prod.example)
#   2. docker compose -f compose.prod.yaml up -d --build
#   3. docker compose -f compose.prod.yaml exec backend npx prisma migrate deploy --schema=prisma/schema.prisma
#   4. (optional first run) docker compose -f compose.prod.yaml exec backend npx tsx prisma/seed.ts

name: civicops-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-civicops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civicops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port mapping - DB is only reachable inside the docker network

  redis:
    image: redis:7-alpine
    container_name: civicops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicops-backend
    restart: unless-stopped
    # Run pending migrations, then start the server
    command: sh -c "npx prisma migrate deploy --schema=prisma/schema.prisma && node dist/server.js"
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-civicops}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-60m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN to your public URL}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative URLs so the frontend's nginx proxies /api and /socket.io to the backend
        VITE_API_URL: /api/v1
        VITE_WS_URL: /
    container_name: civicops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: civicops-prod-network
